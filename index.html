<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HSD Thịt Bếp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #F8FAFC;
            color: #0F172A;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .pb-safe { padding-bottom: max(env(safe-area-inset-bottom), 20px); }
        
        /* Smooth slide-up for bottom sheet */
        @keyframes sheetUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-sheet {
            animation: sheetUp 0.24s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>
<body class="min-h-screen antialiased selection:bg-slate-900 selection:text-white">

    <!-- Minimal Sticky Header -->
    <header class="sticky top-0 z-20 bg-[#F8FAFC]/85 backdrop-blur-md border-b border-slate-200/70">
        <div class="max-w-lg mx-auto px-4 h-14 flex items-center justify-between">
            <div>
                <h1 class="text-[17px] font-bold tracking-tight text-slate-900">HSD Thịt Bếp</h1>
                <p class="text-[11px] font-medium text-slate-400" id="header-date">--/--/----</p>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="copyShiftReport()" class="px-3 py-1.5 rounded-full bg-white border border-slate-200/90 text-slate-600 hover:text-slate-900 active:scale-95 text-xs font-semibold transition">
                    Copy ca
                </button>
                <button onclick="openAddSheet()" class="px-3.5 py-1.5 rounded-full bg-slate-900 text-white hover:bg-slate-800 active:scale-95 text-xs font-semibold shadow-xs transition">
                    + Thêm lô
                </button>
            </div>
        </div>

        <!-- Single-Row iOS Segmented Filter -->
        <div class="max-w-lg mx-auto px-4 pb-3 pt-1">
            <div class="flex items-center gap-1 bg-slate-200/70 p-1 rounded-xl overflow-x-auto no-scrollbar" id="filter-bar">
                <button onclick="setFilter('all')" data-filter="all" class="filter-btn flex-1 py-1.5 px-2.5 rounded-lg text-xs font-semibold whitespace-nowrap bg-white text-slate-900 shadow-2xs transition">
                    Tất cả
                </button>
                <button onclick="setFilter('urgent')" data-filter="urgent" class="filter-btn flex-1 py-1.5 px-2.5 rounded-lg text-xs font-medium whitespace-nowrap text-slate-600 transition flex items-center justify-center gap-1">
                    <span>Sắp hết hạn</span>
                    <span id="urgent-badge" class="hidden px-1.5 py-0.2 rounded-full bg-red-500 text-white text-[10px] font-bold">0</span>
                </button>
                <button onclick="setFilter('chill')" data-filter="chill" class="filter-btn flex-1 py-1.5 px-2.5 rounded-lg text-xs font-medium whitespace-nowrap text-slate-600 transition">
                    Chill
                </button>
                <button onclick="setFilter('sauce')" data-filter="sauce" class="filter-btn flex-1 py-1.5 px-2.5 rounded-lg text-xs font-medium whitespace-nowrap text-slate-600 transition">
                    Sốt
                </button>
                <button onclick="setFilter('alc')" data-filter="alc" class="filter-btn flex-1 py-1.5 px-2.5 rounded-lg text-xs font-medium whitespace-nowrap text-slate-600 transition">
                    ALC
                </button>
            </div>
        </div>
    </header>

    <!-- Main Clean Batch List -->
    <main class="max-w-lg mx-auto px-4 pt-3 pb-24">
        <div id="batch-list" class="divide-y divide-slate-100 bg-white rounded-2xl border border-slate-200/70 shadow-2xs overflow-hidden">
            <!-- Rows injected by JS -->
        </div>

        <!-- Subtle Empty State -->
        <div id="empty-state" class="hidden py-20 text-center space-y-2">
            <p class="text-sm font-medium text-slate-400">Chưa có lô thịt nào trong mục này</p>
            <button onclick="openAddSheet()" class="text-xs font-semibold text-slate-900 underline underline-offset-4">
                + Nhập lô đầu tiên
            </button>
        </div>
    </main>

    <!-- ========================================== -->
    <!-- BOTTOM SHEET 1: ADD / EDIT BATCH           -->
    <!-- ========================================== -->
    <div id="add-sheet" class="fixed inset-0 z-40 hidden bg-slate-900/40 backdrop-blur-[2px] flex items-end justify-center" onclick="if(event.target===this) closeSheet('add-sheet')">
        <div class="bg-white w-full max-w-lg rounded-t-3xl p-5 pb-safe shadow-2xl animate-sheet space-y-5">
            <!-- Handle bar -->
            <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto -mt-1"></div>

            <div class="flex items-center justify-between">
                <h2 class="text-base font-bold text-slate-900" id="sheet-title">Thêm lô thịt mới</h2>
                <button onclick="closeSheet('add-sheet')" class="text-xs font-medium text-slate-400 hover:text-slate-700 px-2 py-1">Đóng</button>
            </div>

            <form onsubmit="saveBatch(event)" class="space-y-4">
                <input type="hidden" id="edit-id">

                <!-- Step 1: Group Selector -->
                <div>
                    <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">1. Nhóm thịt</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" id="grp-chill" onclick="selectGroup('chill')" class="py-2.5 rounded-xl text-xs font-semibold border border-slate-900 bg-slate-900 text-white transition">
                            Chill (+6d)
                        </button>
                        <button type="button" id="grp-sauce" onclick="selectGroup('sauce')" class="py-2.5 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-600 transition">
                            Sốt (+4d)
                        </button>
                        <button type="button" id="grp-alc" onclick="selectGroup('alc')" class="py-2.5 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-600 transition">
                            ALC (+6d)
                        </button>
                    </div>
                </div>

                <!-- Step 2: Meat Name (Chips + Custom Input) -->
                <div>
                    <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">2. Tên thịt</label>
                    <div id="meat-chips" class="flex flex-wrap gap-1.5 max-h-28 overflow-y-auto mb-2">
                        <!-- Chips rendered dynamically -->
                    </div>
                    <input type="text" id="meat-name" required placeholder="Chọn ở trên hoặc nhập tên mới..." 
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-900 placeholder:text-slate-400 focus:bg-white focus:border-slate-900 focus:outline-none transition">
                </div>

                <!-- Step 3: Production Date + Auto Expiry Line -->
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">3. Ngày sản xuất (NSX)</label>
                        <div class="flex gap-1.5">
                            <button type="button" onclick="setQuickDate(0)" class="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-semibold transition">Hôm nay</button>
                            <button type="button" onclick="setQuickDate(-1)" class="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-semibold transition">Hôm qua</button>
                            <button type="button" onclick="setQuickDate(-2)" class="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-semibold transition">Hôm kia</button>
                        </div>
                    </div>
                    <input type="date" id="prod-date" required onchange="updateExpiryPreview()"
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-slate-900 focus:bg-white focus:border-slate-900 focus:outline-none transition">
                    <p class="mt-1.5 text-xs font-medium text-slate-500" id="expiry-preview">→ Hết hạn: --/--/----</p>
                </div>

                <!-- Step 4: Optional Quantity -->
                <div>
                    <input type="text" id="batch-qty" placeholder="Số lượng / khay (tùy chọn, VD: 2 khay)" 
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:bg-white focus:border-slate-900 focus:outline-none transition">
                </div>

                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 active:scale-[0.99] text-white font-semibold text-sm py-3.5 rounded-xl transition">
                    Lưu lô thịt
                </button>
            </form>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- BOTTOM SHEET 2: ROW ACTION MENU (iOS Style)-->
    <!-- ========================================== -->
    <div id="action-sheet" class="fixed inset-0 z-40 hidden bg-slate-900/40 backdrop-blur-[2px] flex items-end justify-center" onclick="if(event.target===this) closeSheet('action-sheet')">
        <div class="bg-white w-full max-w-lg rounded-t-3xl p-5 pb-safe shadow-2xl animate-sheet space-y-2">
            <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-3"></div>
            
            <div class="pb-2 border-b border-slate-100">
                <h3 class="text-sm font-bold text-slate-900" id="action-item-title">Tên thịt</h3>
                <p class="text-xs text-slate-400 mt-0.5" id="action-item-sub">NSX --/-- → HSD --/--</p>
            </div>

            <button id="btn-action-remind" class="w-full py-3 px-3 rounded-xl hover:bg-slate-50 active:bg-slate-100 text-left text-sm font-semibold text-slate-800 flex items-center justify-between transition">
                <span>Nhắc trên iPhone (.ics)</span>
                <span class="text-xs font-normal text-slate-400">08:00 trước 1 ngày</span>
            </button>

            <button id="btn-action-edit" class="w-full py-3 px-3 rounded-xl hover:bg-slate-50 active:bg-slate-100 text-left text-sm font-semibold text-slate-800 transition">
                Chỉnh sửa thông tin
            </button>

            <button id="btn-action-delete" class="w-full py-3 px-3 rounded-xl hover:bg-red-50 active:bg-red-100 text-left text-sm font-semibold text-red-600 transition">
                Đã dùng hết / Xóa lô này
            </button>

            <button onclick="closeSheet('action-sheet')" class="w-full mt-2 py-3 rounded-xl bg-slate-100 text-slate-600 text-sm font-semibold">
                Hủy
            </button>
        </div>
    </div>

    <!-- Minimal Floating Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 hidden bg-slate-900/95 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg whitespace-nowrap transition-opacity"></div>

    <script>
        // ==========================================
        // 1. DATA & SHELF-LIFE RULES
        // ==========================================
        const RULES = {
            chill: { label: 'Chill', days: 6 },
            sauce: { label: 'Sốt', days: 4 },
            alc:   { label: 'ALC', days: 6 }
        };

        const DEFAULT_MEATS = {
            chill: [
                'Rẻ sườn tươi', 'Rẻ sườn hoàng đế', 'Lõi chill', 'Lõi 1,5cm',
                'Gù chill', 'Ba chỉ heo', 'Má heo', 'Sườn la chill', 'Diềm cơ bụng'
            ],
            sauce: [
                'Rẻ sườn gabi', 'Bẹ', 'Lõi gabi', 'Ba chỉ bò gabi',
                'Sườn la gabi', 'Nạc vai heo gabi', 'Sườn heo gabi', 'Gà'
            ],
            alc: [
                'Sườn la ALC', 'Nạc vai heo ALC'
            ]
        };

        const STORAGE_KEY = 'minimal_meat_hsd_v1';
        let batches = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let currentFilter = 'all';
        let selectedGroup = 'chill';

        // Seed 3 clean sample items on very first visit
        if (!localStorage.getItem(STORAGE_KEY)) {
            const getOffsetISO = (d) => {
                const dt = new Date();
                dt.setDate(dt.getDate() + d);
                return toISO(dt);
            };
            batches = [
                { id: '1', name: 'Ba chỉ bò gabi', group: 'sauce', prodDate: getOffsetISO(-3), qty: '2 khay' },
                { id: '2', name: 'Lõi chill', group: 'chill', prodDate: getOffsetISO(-4), qty: '1.5 kg' },
                { id: '3', name: 'Sườn la ALC', group: 'alc', prodDate: getOffsetISO(-1), qty: '3 khay' }
            ];
            saveToStorage();
        }

        // ==========================================
        // 2. DATE UTILITIES
        // ==========================================
        function toISO(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function parseISO(isoStr) {
            const [y, m, d] = isoStr.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function formatShortVN(isoStr) {
            const [, m, d] = isoStr.split('-');
            return `${d}/${m}`;
        }

        function formatFullVN(isoStr) {
            const [y, m, d] = isoStr.split('-');
            return `${d}/${m}/${y}`;
        }

        function getExpiryISO(prodISO, group) {
            const dt = parseISO(prodISO);
            dt.setDate(dt.getDate() + (RULES[group]?.days || 6));
            return toISO(dt);
        }

        function getDaysLeft(expiryISO) {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const exp = parseISO(expiryISO);
            return Math.round((exp - today) / (1000 * 60 * 60 * 24));
        }

        function saveToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(batches));
        }

        // ==========================================
        // 3. RENDER LIST & FILTERS
        // ==========================================
        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.filter === filter) {
                    btn.className = 'filter-btn flex-1 py-1.5 px-2.5 rounded-lg text-xs font-semibold whitespace-nowrap bg-white text-slate-900 shadow-2xs transition flex items-center justify-center gap-1';
                } else {
                    btn.className = 'filter-btn flex-1 py-1.5 px-2.5 rounded-lg text-xs font-medium whitespace-nowrap text-slate-600 transition flex items-center justify-center gap-1';
                }
            });
            renderList();
        }

        function renderList() {
            const listEl = document.getElementById('batch-list');
            const emptyEl = document.getElementById('empty-state');
            const urgentBadge = document.getElementById('urgent-badge');

            let urgentCount = 0;
            const enriched = batches.map(item => {
                const expiryISO = getExpiryISO(item.prodDate, item.group);
                const daysLeft = getDaysLeft(expiryISO);
                if (daysLeft <= 2) urgentCount++;
                return { ...item, expiryISO, daysLeft };
            }).sort((a, b) => a.daysLeft - b.daysLeft);

            // Update urgent badge count
            if (urgentCount > 0) {
                urgentBadge.textContent = urgentCount;
                urgentBadge.classList.remove('hidden');
            } else {
                urgentBadge.classList.add('hidden');
            }

            const visible = enriched.filter(item => {
                if (currentFilter === 'urgent') return item.daysLeft <= 2;
                if (currentFilter === 'chill') return item.group === 'chill';
                if (currentFilter === 'sauce') return item.group === 'sauce';
                if (currentFilter === 'alc') return item.group === 'alc';
                return true;
            });

            if (visible.length === 0) {
                listEl.classList.add('hidden');
                emptyEl.classList.remove('hidden');
                return;
            }

            listEl.classList.remove('hidden');
            emptyEl.classList.add('hidden');

            listEl.innerHTML = visible.map(item => {
                const groupLabel = RULES[item.group]?.label || '';
                
                // Clean status dot & color typography
                let dotColor = 'bg-emerald-500';
                let statusText = `Còn ${item.daysLeft} ngày`;
                let statusColor = 'text-slate-600';

                if (item.daysLeft < 0) {
                    dotColor = 'bg-red-500';
                    statusText = 'Hết hạn';
                    statusColor = 'text-red-600 font-bold';
                } else if (item.daysLeft === 0) {
                    dotColor = 'bg-red-500';
                    statusText = 'Hôm nay';
                    statusColor = 'text-red-600 font-bold';
                } else if (item.daysLeft <= 2) {
                    dotColor = 'bg-amber-500';
                    statusText = `Còn ${item.daysLeft} ngày`;
                    statusColor = 'text-amber-600 font-bold';
                }

                return `
                    <div onclick="openActionSheet('${item.id}')" class="px-4 py-3.5 flex items-center justify-between gap-3 hover:bg-slate-50/80 active:bg-slate-100/80 cursor-pointer transition">
                        <!-- Left: Core Info -->
                        <div class="min-w-0 space-y-1">
                            <div class="flex items-center gap-2">
                                <span class="text-[15px] font-semibold text-slate-900 truncate">${escapeHtml(item.name)}</span>
                                <span class="px-1.5 py-0.5 rounded-md bg-slate-100 text-slate-500 text-[10px] font-semibold shrink-0">${groupLabel}</span>
                                ${item.qty ? `<span class="text-xs text-slate-400 truncate">• ${escapeHtml(item.qty)}</span>` : ''}
                            </div>
                            <div class="text-xs text-slate-400 font-medium">
                                NSX ${formatShortVN(item.prodDate)} &rarr; HSD <span class="text-slate-600">${formatShortVN(item.expiryISO)}</span>
                            </div>
                        </div>

                        <!-- Right: Days Remaining -->
                        <div class="flex items-center gap-2 shrink-0">
                            <span class="w-2 h-2 rounded-full ${dotColor}"></span>
                            <span class="text-xs font-semibold ${statusColor}">${statusText}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ==========================================
        // 4. ADD / EDIT SHEET LOGIC
        // ==========================================
        function openAddSheet() {
            document.getElementById('sheet-title').textContent = 'Thêm lô thịt mới';
            document.getElementById('edit-id').value = '';
            document.getElementById('meat-name').value = '';
            document.getElementById('batch-qty').value = '';
            selectGroup('chill');
            setQuickDate(0);
            document.getElementById('add-sheet').classList.remove('hidden');
        }

        function openEditSheet(id) {
            closeSheet('action-sheet');
            const item = batches.find(b => b.id === id);
            if (!item) return;

            document.getElementById('sheet-title').textContent = 'Sửa lô thịt';
            document.getElementById('edit-id').value = item.id;
            selectGroup(item.group);
            document.getElementById('meat-name').value = item.name;
            document.getElementById('prod-date').value = item.prodDate;
            document.getElementById('batch-qty').value = item.qty || '';
            updateExpiryPreview();
            document.getElementById('add-sheet').classList.remove('hidden');
        }

        function closeSheet(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function selectGroup(group) {
            selectedGroup = group;
            ['chill', 'sauce', 'alc'].forEach(g => {
                const btn = document.getElementById(`grp-${g}`);
                btn.className = g === group
                    ? 'py-2.5 rounded-xl text-xs font-semibold border border-slate-900 bg-slate-900 text-white transition'
                    : 'py-2.5 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-600 transition';
            });
            renderChips();
            updateExpiryPreview();
        }

        function renderChips() {
            const container = document.getElementById('meat-chips');
            const list = DEFAULT_MEATS[selectedGroup] || [];
            container.innerHTML = list.map(name => `
                <button type="button" onclick="document.getElementById('meat-name').value='${escapeHtml(name)}'" 
                    class="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 active:bg-slate-900 active:text-white text-xs font-medium text-slate-700 transition">
                    ${escapeHtml(name)}
                </button>
            `).join('');
        }

        function setQuickDate(offsetDays) {
            const dt = new Date();
            dt.setDate(dt.getDate() + offsetDays);
            document.getElementById('prod-date').value = toISO(dt);
            updateExpiryPreview();
        }

        function updateExpiryPreview() {
            const prodISO = document.getElementById('prod-date').value;
            if (!prodISO) return;
            const expISO = getExpiryISO(prodISO, selectedGroup);
            document.getElementById('expiry-preview').textContent = `→ Hết hạn: ${formatFullVN(expISO)}`;
        }

        function saveBatch(e) {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const name = document.getElementById('meat-name').value.trim();
            const prodDate = document.getElementById('prod-date').value;
            const qty = document.getElementById('batch-qty').value.trim();

            if (!name || !prodDate) return;

            if (id) {
                const idx = batches.findIndex(b => b.id === id);
                if (idx !== -1) batches[idx] = { ...batches[idx], name, group: selectedGroup, prodDate, qty };
                showToast('Đã cập nhật lô thịt');
            } else {
                batches.push({ id: String(Date.now()), name, group: selectedGroup, prodDate, qty });
                showToast('Đã thêm lô thịt');
            }

            saveToStorage();
            renderList();
            closeSheet('add-sheet');
        }

        // ==========================================
        // 5. ROW ACTION MENU, iOS REMINDER & COPY
        // ==========================================
        function openActionSheet(id) {
            const item = batches.find(b => b.id === id);
            if (!item) return;

            const expISO = getExpiryISO(item.prodDate, item.group);
            document.getElementById('action-item-title').textContent = `${item.name} (${RULES[item.group]?.label})`;
            document.getElementById('action-item-sub').textContent = `NSX ${formatShortVN(item.prodDate)} → HSD ${formatFullVN(expISO)}`;

            document.getElementById('btn-action-remind').onclick = () => {
                closeSheet('action-sheet');
                downloadICS(item, expISO);
            };
            document.getElementById('btn-action-edit').onclick = () => openEditSheet(id);
            document.getElementById('btn-action-delete').onclick = () => {
                batches = batches.filter(b => b.id !== id);
                saveToStorage();
                renderList();
                closeSheet('action-sheet');
                showToast('Đã xóa lô thịt');
            };

            document.getElementById('action-sheet').classList.remove('hidden');
        }

        function downloadICS(item, expISO) {
            const expDate = parseISO(expISO);
            expDate.setDate(expDate.getDate() - 1); // Remind 1 day before expiry

            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const target = expDate < today ? today : expDate;

            const y = target.getFullYear();
            const m = String(target.getMonth() + 1).padStart(2, '0');
            const d = String(target.getDate()).padStart(2, '0');
            const dtStart = `${y}${m}${d}T080000`;
            const dtEnd = `${y}${m}${d}T083000`;
            const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
            const summary = `Ưu tiên dùng: ${item.name} (${RULES[item.group]?.label})`;
            const desc = `NSX: ${formatFullVN(item.prodDate)} | HSD: ${formatFullVN(expISO)}${item.qty ? ' | SL: ' + item.qty : ''}`;

            const ics = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//HSD Thit Bep//iOS//VI',
                'BEGIN:VTODO',
                `UID:todo-${item.id}-${Date.now()}@hsdbep`,
                `DTSTAMP:${stamp}`,
                `DUE:${dtStart}`,
                `SUMMARY:${summary}`,
                `DESCRIPTION:${desc}`,
                'BEGIN:VALARM',
                'ACTION:DISPLAY',
                `DESCRIPTION:${summary}`,
                `TRIGGER;VALUE=DATE-TIME:${dtStart}`,
                'END:VALARM',
                'END:VTODO',
                'BEGIN:VEVENT',
                `UID:ev-${item.id}-${Date.now()}@hsdbep`,
                `DTSTAMP:${stamp}`,
                `DTSTART:${dtStart}`,
                `DTEND:${dtEnd}`,
                `SUMMARY:${summary}`,
                `DESCRIPTION:${desc}`,
                'BEGIN:VALARM',
                'ACTION:DISPLAY',
                `DESCRIPTION:${summary}`,
                'TRIGGER:-PT0M',
                'END:VALARM',
                'END:VEVENT',
                'END:VCALENDAR'
            ].join('\r\n');

            const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Nhac_${item.name.replace(/\s+/g, '_')}.ics`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);

            showToast('Đã tạo nhắc lịch 08:00 trước hạn 1 ngày');
        }

        function copyShiftReport() {
            if (batches.length === 0) {
                showToast('Danh sách đang trống');
                return;
            }

            const sorted = batches.map(item => {
                const expISO = getExpiryISO(item.prodDate, item.group);
                return { ...item, expISO, daysLeft: getDaysLeft(expISO) };
            }).sort((a, b) => a.daysLeft - b.daysLeft);

            const todayStr = formatFullVN(toISO(new Date()));
            const lines = sorted.map(i => {
                const st = i.daysLeft < 0 ? 'HẾT HẠN' : (i.daysLeft === 0 ? 'Hôm nay' : `Còn ${i.daysLeft}d`);
                return `• ${i.name} (${RULES[i.group]?.label}) - HSD ${formatShortVN(i.expISO)} [${st}]${i.qty ? ' - ' + i.qty : ''}`;
            });

            const text = `BÁO CÁO HSD THỊT (${todayStr}):\n` + lines.join('\n');
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);

            showToast('Đã sao chép báo cáo ca');
        }

        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.remove('hidden');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => el.classList.add('hidden'), 2400);
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Init on load
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('header-date').textContent = formatFullVN(toISO(new Date()));
            renderList();
        });
    </script>
</body>
</html>
